site_name: CVForge
site_description: Local-first personal professional knowledge system that generates tailored, evidence-backed CVs
repo_url: https://github.com/SelfishCoconut/cvforge
edit_uri: ""

# Three working-document trees live under docs/ but are not site pages.
#
# superpowers/ (the plan and spec) carries relative links written for the files it
# describes, which resolve against docs/superpowers/plans/ and fail --strict.
#
# reports/ (progress-report skill) and sanity/ (codebase-sanity agent) are written
# on demand, one dated file per run. Since validation.nav.omitted_files became
# `warn` below, ANY page under docs/ that is absent from nav aborts the strict
# build -- so the first progress report or sanity audit would have turned the
# required `Docs build` context red without a line of code changing.
#
# exclude_docs, not not_in_nav: not_in_nav suppresses only the orphan warning and
# still builds and LINK-CHECKS the file. These reports are generated text citing
# file:line, and one relative link into src/ would fail strict link validation --
# the second way this same file class can redden the gate. exclude_docs closes both.
exclude_docs: |
  superpowers/
  reports/
  sanity/

# An ADR or page missing from `nav` is unreachable from the site, and mkdocs
# reports that at INFO by default, so --strict does NOT catch it. Adding an ADR
# is a three-file change (the file, the README index row, this nav) and half-doing
# it has to fail the build, not pass quietly. Link validation is already `warn`
# by default, which is what makes --strict catch broken links.
validation:
  nav:
    omitted_files: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Requirements: requirements/srs.md
  - Architecture:
      - Overview: architecture/overview.md
      - Knowledge model: architecture/knowledge-model.md
  - Decisions:
      - Index: adr/README.md
      - 0001 SQLite knowledge store: adr/0001-sqlite-knowledge-store.md
      - 0002 Single process for API and SPA: adr/0002-single-process-api-and-spa.md
      - 0003 Changeset review pipeline: adr/0003-changeset-review-pipeline.md
      - 0004 SRS is the source of requirement text: adr/0004-srs-is-the-source-of-requirement-text.md
      - 0005 Action pinning policy: adr/0005-action-pinning-policy.md
      - 0006 SQLAlchemy Core and Alembic: adr/0006-sqlalchemy-core-and-alembic.md
      - 0007 Material native Mermaid: adr/0007-material-native-mermaid.md
      - 0008 Close M0 on evidence: adr/0008-close-m0-on-evidence-not-issues.md
  - API reference: reference/api.md

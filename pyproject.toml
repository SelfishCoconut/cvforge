[project]
name = "cvforge"
version = "0.1.0"
description = "Local-first personal professional knowledge system that generates tailored CVs"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Álvaro Navarro", email = "182025519+SelfishCoconut@users.noreply.github.com" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.142.3",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=2.53.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.2",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    # Mechanical quality signals consumed by sanity.yml and the codebase-sanity agent.
    "radon>=6.0",
    "xenon>=0.9",
    "vulture>=2.13",
    "pylint>=4.1.1",
    # Documentation site. MkDocs 2.0 removes the plugin system (search and mkdocstrings
    # stop working), so cap it until a deliberate migration with an ADR (see #57).
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<1"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit — this tool fetches untrusted web pages and shells out to LaTeX
    "C90",       # mccabe complexity
    "N",         # naming
    "D",         # pydocstyle — docstrings render into the docs site
    "RUF",
]
ignore = ["D203", "D213"]  # incompatible docstring-style pairs; D211/D212 are used instead

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # asserts are the point; docstrings optional in tests
# Alembic revisions are generated; their CHECK expressions are single SQL strings.
"src/cvforge/kb/migrations/versions/*" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
# `scripts` is in scope on purpose: scripts/demo/* is the PR template's mandatory
# "How to validate" artifact, so it is load-bearing process infrastructure.
# `.claude/hooks` likewise: the two gating hooks guard private data and
# invariant 2, and they were silently dead once while no gate looked at them.
files = ["src", "tests", "scripts", ".claude/hooks"]
pretty = true

[[tool.mypy.overrides]]
# sqlite-vec ships no py.typed marker or stubs (upstream, as of 0.1.9).
module = "sqlite_vec"
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: real component wiring and real I/O (CI: separate job)",
    "golden: snapshot comparison against committed golden files (CI: separate job)",
    "system: full end-to-end against a browser or external service (CI: nightly only)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/cvforge"]
branch = true
# Alembic revisions are generated DDL, run by Alembic itself; the integration drift
# test (tests/integration/test_migrations.py) is what gates them.
omit = ["src/cvforge/kb/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

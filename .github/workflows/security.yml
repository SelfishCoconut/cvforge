# .github/workflows/security.yml
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  # On demand, and the only way to get a full-history secret scan without
  # waiting for Monday — see the comment on the `secrets` job below.
  workflow_dispatch:

jobs:
  audit-dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # --all-extras matters: without it the optional extras this project will
      # grow (playwright, document parsers) would never be audited.
      - run: uv export --no-emit-project --locked --all-extras -o requirements-audit.txt
      - run: uv tool run pip-audit -r requirements-audit.txt

  sast:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv tool run bandit -r src scripts -ll

  secrets:
    name: Gitleaks (history scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed by the FULL-history scan only. gitleaks-action decides its
          # own scan range from the event: `schedule` and `workflow_dispatch`
          # scan the whole history, while `push` and `pull_request` pass
          # --log-opts and scan only the incoming commits. So the job name is
          # accurate for the weekly and on-demand runs; on a PR it is a fast
          # incremental check, which is the behaviour you want gating merges.
          fetch-depth: 0
      # The only THIRD-PARTY action here that receives a token, so it is pinned
      # by commit digest rather than by tag: a tag can be re-pointed by its
      # owner, and this step would then run new code holding GITHUB_TOKEN. The
      # github-actions ecosystem in dependabot.yml keeps the pin current.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # `security-events: write` REPLACES the default permission set, so
      # `contents: read` has to be restated or checkout breaks on a private repo.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # Both languages in ONE job on purpose. A build matrix renames the
          # check contexts to "CodeQL (python)" / "CodeQL (javascript-typescript)",
          # and branch protection requiring a context named exactly "CodeQL" would
          # then never be satisfied — every PR sits blocked with all checks green.
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4

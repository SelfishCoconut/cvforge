# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # `scripts` is included on purpose: scripts/demo/* is the PR template's
      # mandatory validation artifact, so it is load-bearing. Ungated, demos rot.
      - run: uv run ruff check src tests scripts .claude/hooks
      - run: uv run ruff format --check src tests scripts .claude/hooks
      - run: uv run mypy
      - name: Complexity gate
        run: uv run xenon --max-absolute C --max-modules B --max-average A src .claude/hooks

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # fail_under=90 with branch coverage lives in pyproject.toml, so the floor
      # is identical locally and here.
      - run: >-
          uv run pytest -m "not integration and not golden and not system"
          --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov

  golden:
    name: Golden snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Never pass --update-golden here: in CI the snapshot is the expectation,
      # not an output.
      - run: uv run pytest -m golden --no-cov

  demos:
    name: Offline demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Every demo a reviewer is told to run to validate a PR. A broken one voids
      # the Definition of Done, so it must break the build.
      - run: make test-demos

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # --strict is the point: a broken link or an unresolved mkdocstrings
      # reference fails the build before merge, not after.
      - run: make docs

# .github/workflows/system.yml
name: System tests

# Nightly end-to-end tests (`pytest -m system`). Deliberately NOT a required
# context: they may need a browser or an external service and must not gate merges.
on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system:
    name: System tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run system tests
        run: uv run pytest -m system --no-cov

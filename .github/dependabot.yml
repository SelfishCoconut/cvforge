# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        # Majors arrive as individual PRs so one broken member cannot block the rest (#53).
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint's peer range is `typescript >=4.8.4 <6.1.0` (verified with
      # `npm view typescript-eslint peerDependencies`, 8.71.1), so a TypeScript 6.1+
      # bump fails `npm ci` with ERESOLVE. Version-scoped on purpose: DELETE this
      # entry — do not widen it — once typescript-eslint supports TypeScript 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
